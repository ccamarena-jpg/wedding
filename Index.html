<!-- Wedding Planner · Claudia & Jorge · Google Apps Script Web App -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestra Boda · Organizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta del moodboard "Claudia y Jorge": cálida y natural — marfil, taupe champagne, espresso, salvia */
  --green-900:#3a2c20; --green-800:#4a3728; --green-700:#5f4535; --green-600:#7a6450;
  --gold:#b79b74; --gold-soft:#d8c7ab; --gold-deep:#9c8054;
  --cream:#f4f0e8; --cream-2:#ece4d6; --card:#faf6ee; --card-2:#f2ebdd;
  --ink:#2e2620; --muted:#8f8473; --line:#e7ddcb; --line-2:#dccdb4;
  --danger:#a2503c; --danger-bg:#f3e5de; --warn:#9c7b3f; --warn-bg:#f4ecd7; --ok:#7c8663;
  --shadow:0 10px 30px rgba(58,44,32,.12); --shadow-sm:0 4px 14px rgba(58,44,32,.09);
  --r:16px; --r-sm:11px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Jost',system-ui,sans-serif; color:var(--ink);
  background:var(--cream);
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Playfair Display',Georgia,serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif; margin:0; font-weight:600; letter-spacing:.2px}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 16px}
.brand .mono{
  width:44px;height:44px;border-radius:12px;background:var(--green-800);color:var(--gold-soft);
  display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:24px;font-weight:700;
}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.brand b{font-family:'Playfair Display',serif;font-size:19px;font-weight:600}
.nav-group{margin-top:12px;padding:0 8px;color:var(--muted);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink);
  text-decoration:none;font-size:14.5px;font-weight:400;transition:.15s;cursor:pointer
}
.nav a .ic{width:20px;text-align:center;opacity:.85}
.nav a:hover{background:var(--card-2)}
.nav a.active{background:var(--green-800);color:#fff;box-shadow:var(--shadow-sm)}
.nav a.active .ic{opacity:1}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}

.main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1180px}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;overflow:auto}
  .side-foot{display:none}.nav-group{display:none}
  .main{padding:20px 16px 60px}
}

/* ---------- Banner ---------- */
.banner{
  background:linear-gradient(135deg,#dccfb7,#cbb99b);color:var(--ink);border-radius:var(--r);
  padding:22px 26px;box-shadow:var(--shadow);margin-bottom:22px;position:relative;overflow:hidden
}
.banner:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.28)}
.banner .kick{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--green-800);opacity:.85}
.banner h1{font-size:34px;margin:2px 0 4px;display:flex;align-items:center;gap:12px}
.banner p{margin:0;color:rgba(46,38,32,.72);font-size:15px;max-width:640px;font-family:'Playfair Display',serif;font-style:italic}
.banner .actions{position:absolute;right:22px;bottom:20px;display:flex;gap:10px}
@media(max-width:640px){.banner .actions{position:static;margin-top:14px}}

/* ---------- Buttons ---------- */
.btn{border:1px solid transparent;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.15s;background:#fff;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:#3a2f13;border-color:var(--gold-deep)}
.btn.gold:hover{background:var(--gold-soft)}
.btn.green{background:var(--green-800);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(58,44,32,.28);color:var(--ink)}
.banner .btn.gold,.hero .btn.gold{background:var(--green-800);color:#fff;border-color:var(--green-900)}
.banner .btn.gold:hover,.hero .btn.gold:hover{background:var(--green-700)}
.btn.line{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{color:var(--danger);border-color:var(--danger)}

/* ---------- Cards / KPI ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:'Playfair Display',serif;font-size:30px;font-weight:600;margin-top:3px;line-height:1}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}
.kpi.accent{background:linear-gradient(135deg,#fbf5e5,#f6edd4);border-color:var(--gold-soft)}
.kpi .val.dg{color:var(--danger)} .kpi .val.ok{color:var(--ok)}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.section-title h2{font-size:24px}
.section-title .hint{color:var(--muted);font-size:14px;font-family:'Playfair Display',serif;font-style:italic}

/* progress */
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--green-700),var(--gold))}
.bar.thin{height:7px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{color:var(--ink);font-weight:500}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line-2);background:#fff}
.badge.green{background:#e9ebdd;border-color:#d3d7bf;color:#5a6340}
.badge.gold{background:#f6edd4;border-color:var(--gold-soft);color:#7a5f22}
.badge.gray{background:#efeadd;color:#77715e}
.badge.red{background:var(--danger-bg);border-color:#e2c4bd;color:var(--danger)}
.badge.blue{background:#e6ecec;border-color:#c8d4d4;color:#3f5453}

/* tables */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:13px 16px;background:var(--card-2);border-bottom:1px solid var(--line)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fdfbf4}
.t-name{font-weight:500}
.t-sub{color:var(--muted);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:6px;justify-content:flex-end;opacity:.5}
tr:hover .row-actions{opacity:1}
.icon-btn{border:1px solid var(--line-2);background:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:13px}
.icon-btn:hover{background:var(--card-2)}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar input,.toolbar select{
  border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:9px 14px;font-family:inherit;font-size:13.5px;color:var(--ink)
}
.toolbar .search{flex:1;min-width:200px}
.spacer{flex:1}

/* alerts */
.alert{border-radius:12px;padding:12px 15px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-top:10px;line-height:1.4}
.alert.warn{background:var(--warn-bg);border:1px solid #ecdcae;color:#77591f}
.alert.red{background:var(--danger-bg);border:1px solid #e2c4bd;color:var(--danger)}
.alert .ic{font-size:15px}

/* timeline (cronograma) */
.tl-block{margin:18px 0 8px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.tl-block .ln{flex:1;height:1px;background:var(--line)}
.tl-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:16px;align-items:flex-start;box-shadow:var(--shadow-sm)}
.tl-item .time{min-width:96px}
.tl-item .time b{font-family:'Playfair Display',serif;font-size:19px}
.tl-item .time span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.tl-item .body{flex:1}
.tl-item .body h4{margin:0;font-size:16px;font-family:'Playfair Display',serif;font-weight:600}
.tl-item .meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--green-700);margin-top:6px;flex:0 0 auto;box-shadow:0 0 0 4px #efe7d7}

/* gantt */
.gantt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 0 14px;overflow-x:auto}
.gantt-head{display:grid;position:relative;border-bottom:1px solid var(--line);padding:0 0 8px}
.gantt-row{display:grid;align-items:center;border-bottom:1px solid var(--line);min-height:52px}
.gantt-row:last-child{border-bottom:none}
.gantt-label{padding:10px 16px;position:sticky;left:0;background:var(--card);z-index:2;border-right:1px solid var(--line)}
.gantt-label b{font-size:13.5px;display:block}
.gantt-label span{font-size:11.5px;color:var(--muted)}
.gantt-track{position:relative;height:100%}
.gantt-months{display:flex;font-size:11px;color:var(--muted);letter-spacing:.05em}
.gantt-months div{flex:1;padding:8px 8px;border-left:1px solid var(--line);text-transform:capitalize}
.gbar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:#fff;white-space:nowrap;box-shadow:var(--shadow-sm);cursor:pointer}
.gbar.cotizado{background:linear-gradient(90deg,#c3b39c,#a89373)}
.gbar.contratado{background:linear-gradient(90deg,#7a5c40,#5f4535)}
.gbar.pagado{background:linear-gradient(90deg,var(--gold),var(--gold-deep));color:#3a2f13}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:3}
.gantt-today b{position:absolute;top:-2px;left:-18px;font-size:9px;background:var(--danger);color:#fff;padding:2px 5px;border-radius:5px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(45,50,35,.42);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--cream);border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-head{background:linear-gradient(135deg,#dccfb7,#cbb99b);color:var(--ink);padding:18px 22px;border-radius:20px 20px 0 0;position:sticky;top:0}
.modal-head h3{font-size:22px}
.modal-head small{color:var(--green-800);letter-spacing:.16em;text-transform:uppercase;font-size:10.5px}
.modal-body{padding:20px 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink)
}
.field textarea{min-height:64px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-foot{padding:6px 22px 22px;display:flex;gap:10px;justify-content:flex-end}

/* misc */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ic{width:38px;height:38px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;font-size:18px;margin-bottom:10px}
.tile b{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;display:block}
.tile span{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.hero{
  background:linear-gradient(135deg,#dccfb7,#cbb99b);color:var(--ink);border-radius:var(--r);
  padding:22px 26px;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow);margin-bottom:20px;flex-wrap:wrap
}
.hero .days{font-family:'Playfair Display',serif;font-size:56px;font-weight:700;line-height:.9}
.hero .days small{display:block;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-top:4px}
.hero .sep{width:1px;align-self:stretch;background:rgba(58,44,32,.18)}
.hero .info b{font-family:'Playfair Display',serif;font-size:22px}
.hero .info span{display:block;color:rgba(46,38,32,.66);font-size:13px}
.hero .spacer{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-800);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{position:fixed;inset:0;background:var(--cream);display:grid;place-items:center;z-index:100}
.loading .spin{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--green-700);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill-inline{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
</style>
</head>

<script>
/* =========================================================================
   DATA LAYER  ·  works in THREE modes:
   - Inside Apps Script      -> google.script.run (real Sheets + Calendar)
   - Vercel/estático + API   -> llama al Apps Script publicado como API (JSONP)
   - Standalone (preview)     -> datos de ejemplo en memoria (no guarda)
   ========================================================================= */

/* ►►► CONECTAR CON TU GOOGLE SHEET ◄◄◄
   1) Implementá el Apps Script como Aplicación web con acceso "Cualquiera".
   2) Copiá la URL que termina en /exec y pegala acá abajo entre las comillas.
   3) (opcional) Poné el mismo token que en Code.gs para proteger la escritura.
   Mientras API_URL esté vacío, la web funciona en modo demostración.        */
const API_URL   = "";          // p.ej. "https://script.google.com/macros/s/AKfy…/exec"
const API_TOKEN = "boda-cj-2026"; // debe coincidir con TOKEN en Code.gs

const IN_GAS  = (typeof google !== 'undefined' && google.script && google.script.run);
const USE_API = !IN_GAS && /\/macros\/s\//.test(API_URL);

function server(fn, ...args){
  if(IN_GAS){
    return new Promise((res,rej)=>{
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
    });
  }
  if(USE_API) return apiCall(fn, args);
  return MockServer[fn](...args); // demo en memoria
}

/* Llama a la API de Apps Script vía JSONP (evita CORS por completo) */
let _jsonpSeq = 0;
function apiCall(action, args){
  return new Promise((resolve, reject)=>{
    const cb = '__wcb_' + (++_jsonpSeq) + '_' + Date.now();
    const s = document.createElement('script');
    const to = setTimeout(()=>{ cleanup(); reject(new Error('Tiempo de espera agotado')); }, 25000);
    function cleanup(){ clearTimeout(to); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (resp)=>{
      cleanup();
      if(resp && resp.error) reject(new Error(resp.error));
      else resolve(resp ? resp.data : null);
    };
    const qs = 'action=' + encodeURIComponent(action)
             + '&token='  + encodeURIComponent(API_TOKEN)
             + '&payload='+ encodeURIComponent(JSON.stringify(args||[]))
             + '&callback='+ cb;
    s.src = API_URL + (API_URL.indexOf('?')>-1?'&':'?') + qs;
    s.onerror = ()=>{ cleanup(); reject(new Error('No se pudo conectar con la API')); };
    document.head.appendChild(s);
  });
}

/* Mock server for standalone preview */
const MockServer = {
  _d: JSON.parse(JSON.stringify(SAMPLE)),
  _uid(){ return 'x'+Math.random().toString(36).slice(2,9); },
  getBootstrap(){ return Promise.resolve(JSON.parse(JSON.stringify(this._d))); },
  saveConfig(c){ this._d.config=Object.assign(this._d.config,c); return Promise.resolve(this._d.config); },
  upsert(tab,obj){
    const arr=this._d[tab];
    if(obj.id){ const i=arr.findIndex(x=>x.id===obj.id); if(i>=0){arr[i]=obj;return Promise.resolve(obj);} }
    obj.id=this._uid(); arr.push(obj); return Promise.resolve(obj);
  },
  remove(tab,id){ this._d[tab]=this._d[tab].filter(x=>x.id!==id); return Promise.resolve(true); },
  syncCita(id){ const c=this._d.citas.find(x=>x.id===id); if(c) c.eventId='mock-'+id; return Promise.resolve(c); }
};

/* =========================================================================
   STATE + HELPERS
   ========================================================================= */
let DB = null;
let CURRENT = 'inicio';
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function money(n){
  const cur = DB && DB.config.moneda || 'PEN';
  try{ return new Intl.NumberFormat('es-PE',{style:'currency',currency:cur,maximumFractionDigits:0}).format(+n||0); }
  catch(e){ return 'S/ '+Math.round(+n||0).toLocaleString('es-PE'); }
}
function num(n){ return (+n||0).toLocaleString('es-PE'); }
function daysTo(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr+'T00:00:00'), t=new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function fmtDateLong(dateStr){
  if(!dateStr) return '—';
  const d=new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function setSaving(s){ $('#saveStatus').textContent = s ? 'Guardando…' : 'Todo guardado'; }

/* =========================================================================
   BOOT
   ========================================================================= */
async function boot(){
  DB = await server('getBootstrap');
  const names = DB.config.pareja || 'Nuestra Boda';
  $('#brandNames').textContent = names;
  $('#brandMono').textContent = names.split('&').map(s=>s.trim()[0]).filter(Boolean).slice(0,2).join('') || 'B';
  $('#loading').style.display='none';
  $('#app').style.display='flex';
  $$('#nav a').forEach(a=>a.addEventListener('click',()=>go(a.dataset.view)));
  render();
}
function go(view){
  CURRENT=view;
  $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===view));
  render();
  window.scrollTo(0,0);
}
function render(){ ({inicio:vInicio,presupuesto:vPresupuesto,proveedores:vProveedores,invitados:vInvitados,cronograma:vCronograma,citas:vCitas}[CURRENT]||vInicio)(); }

/* =========================================================================
   DERIVED METRICS
   ========================================================================= */
function metrics(){
  const total = +DB.config.presupuestoTotal||0;
  const estimado = DB.presupuesto.reduce((s,x)=>s+(+x.estimado||0),0);
  const cotizado = DB.proveedores.reduce((s,x)=>s+(+x.cotizado||0),0);
  const pagado = DB.proveedores.reduce((s,x)=>s+(+x.pagado||0),0);
  const personas = DB.invitados.reduce((s,x)=>s+(+x.personas||0),0);
  const confirmadas = DB.invitados.filter(x=>/confirm/i.test(x.confirmacion)).reduce((s,x)=>s+(+x.personas||0),0);
  const invitaciones = DB.invitados.length;
  const contratados = DB.proveedores.filter(x=>/contratado|pagado/i.test(x.estado)).length;
  return {total,estimado,cotizado,pagado,personas,confirmadas,invitaciones,contratados,
    pctPagado: cotizado? Math.round(pagado/cotizado*100):0,
    pctConfirm: personas? Math.round(confirmadas/personas*100):0,
    planN: +DB.config.invitadosPlan||0,
    porInvitado: (personas|| (+DB.config.invitadosPlan||0))? Math.round(total/(personas||(+DB.config.invitadosPlan||0))):0};
}
function catCotizado(cat){ return DB.proveedores.filter(v=>v.categoria===cat).reduce((s,v)=>s+(+v.cotizado||0),0); }
function catPagado(cat){ return DB.proveedores.filter(v=>v.categoria===cat).reduce((s,v)=>s+(+v.pagado||0),0); }

   VIEW · INICIO

        ${chk(DB.presupuesto.length,'Presupuesto')} ${chk(DB.proveedores.length,'Proveedores')}
        ${chk(DB.invitados.length,'Invitados')} ${chk(DB.cronograma.length,'Cronograma')}
        ${chk(DB.citas.length,'Citas')}

      ${kpi('Pagado',money(m.pagado),m.pctPagado+'% de lo cotizado','ok')}

    </div>

      ${tile('⏰','Cronograma','Secuencia y responsables del gran día.','cronograma')}
      ${tile('📅','Citas & Gantt','Fechas de atención sincronizadas a tu calendar.','citas')}

}
function chk(ok,label){ return `<span class="pill-inline">${ok?'✓':'○'} <b>${label}</b></span>`; }
function kpi(lbl,val,sub,cls=''){ return `<div class="kpi ${cls.includes('accent')?'accent':''}"><div class="lbl">${lbl}</div><div class="val ${cls.replace('accent','')}">${val}</div><div class="sub">${sub}</div></div>`; }
function tile(ic,title,desc,view){ return `<div class="tile" onclick="go('${view}')"><div class="ic">${ic}</div><b>${title}</b><span>${desc}</span></div>`; }
function alertsBlock(m){
  const over = DB.presupuesto.filter(p=>catCotizado(p.categoria) > (+p.estimado||0) && catCotizado(p.categoria)>0);
  const sinProv = DB.presupuesto.filter(p=>(+p.estimado||0)>0 && catCotizado(p.categoria)===0);
  let h='';
  if(m.cotizado>m.total) h+=`<div class="alert red"><span class="ic">●</span><div>Lo cotizado supera tu presupuesto total en <b>${money(m.cotizado-m.total)}</b>. Revisá proveedores o ajustá el tope.</div></div>`;
  if(over.length) h+=`<div class="alert red"><span class="ic">●</span><div>${over.length} categoría(s) sobrepasan lo estimado: ${over.map(p=>esc(p.categoria)).join(', ')}.</div></div>`;
  if(sinProv.length) h+=`<div class="alert warn"><span class="ic">▲</span><div>${sinProv.length} categoría(s) con presupuesto sin proveedores cotizados: ${sinProv.map(p=>esc(p.categoria)).join(', ')}.</div></div>`;
  return h ? `<div class="section-title"><h2>Alertas</h2></div>${h}` : '';
}

function fmtDateTime(s){ if(!s)return'—'; const d=new Date(s); return d.toLocaleDateString('es-PE',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}); }
function ganttHTML(citas){
  if(!citas.length) return '<div class="gantt"><div class="empty">Agregá citas para ver el diagrama de Gantt.</div></div>';
  const dates=citas.flatMap(c=>[new Date(c.inicio),new Date(c.fin||c.inicio)]);
  let min=new Date(Math.min(...dates)), max=new Date(Math.max(...dates.map(d=>+d)));
  min.setDate(1); min.setHours(0,0,0,0);
  max=new Date(max.getFullYear(),max.getMonth()+1,0,23,59); // end of last month
  const span=+max-+min || 1;
  // month columns
  const months=[]; let cur=new Date(min);
  while(cur<=max){ months.push(new Date(cur)); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }
  const labelW=180;
  const monthsHead=`<div class="gantt-months" style="margin-left:${labelW}px">${months.map(mo=>`<div>${mo.toLocaleDateString('es-PE',{month:'short',year:'2-digit'})}</div>`).join('')}</div>`;
  const today=new Date();
  const todayPct=(today>=min&&today<=max)? ((+today-+min)/span*100):null;
  const rows=citas.map(c=>{
    const s=new Date(c.inicio), e=new Date(c.fin||c.inicio);
    let left=(+s-+min)/span*100; let w=Math.max(2.5,(+e-+s)/span*100);
    if(left+w>100)w=100-left;
    const cls=/pagado/i.test(c.estado)?'pagado':/contratado/i.test(c.estado)?'contratado':'cotizado';
    return `<div class="gantt-row">
      <div class="gantt-label" style="width:${labelW}px"><b>${esc(c.proveedor||c.titulo)}</b><span>${esc(c.titulo||'')}</span></div>
      <div class="gantt-track">
        <div class="gbar ${cls}" style="left:${left}%;width:${w}%" onclick="editCita('${c.id}')" title="${esc(c.titulo)} — ${fmtDateTime(c.inicio)}">${new Date(c.inicio).toLocaleDateString('es-PE',{day:'numeric',month:'short'})}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="gantt">
    ${monthsHead}
    <div style="position:relative">
      ${todayPct!=null?`<div class="gantt-today" style="left:calc(${labelW}px + (100% - ${labelW}px) * ${todayPct/100})"><b>hoy</b></div>`:''}
      ${rows}
    </div>
    <div class="legend" style="padding:12px 16px 0">
      <span class="pill-inline"><span style="width:12px;height:12px;border-radius:3px;background:#a89373;display:inline-block"></span> Cotizado</span>
      <span class="pill-inline"><span style="width:12px;height:12px;border-radius:3px;background:#5f4535;display:inline-block"></span> Contratado</span>
      <span class="pill-inline"><span style="width:12px;height:12px;border-radius:3px;background:var(--gold);display:inline-block"></span> Pagado</span>
    </div>
  </div>`;
}

    if(f.type==='textarea') return fieldWrap(f,`<textarea id="f_${f.k}">${esc(val)}</textarea>`);

  modalCtx=onSave;
  $('#overlay').classList.add('open');
}
function fieldWrap(f,inner){ return `<div class="field" ${f.half?'style="display:inline-block;width:calc(50% - 6px)"':''}><label>${esc(f.label)}</label>${inner}</div>`; }
function closeModal(){ $('#overlay').classList.remove('open'); modalCtx=null; }
$('#modalSave').addEventListener('click',()=>{ if(modalCtx) modalCtx(); });
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
function getF(k){ const el=$('#f_'+k); return el?el.value:''; }

async function persist(tab,obj,after){
  setSaving(true);
  try{
    const saved=await server('upsert',tab,obj);
    const arr=DB[tab]; const i=arr.findIndex(x=>x.id===saved.id);
    if(i>=0)arr[i]=saved; else arr.push(saved);
    closeModal(); render(); toast('Guardado ✓');
    if(after)after(saved);
  }catch(e){ toast('Error al guardar'); console.error(e); }
  setSaving(false);
}
async function del(tab,id){
  if(!confirm('¿Eliminar este registro?')) return;
  setSaving(true);
  try{ await server('remove',tab,id); DB[tab]=DB[tab].filter(x=>x.id!==id); render(); toast('Eliminado'); }
  catch(e){ toast('Error'); } setSaving(false);
}

/* Config */
function editConfig(){
  const c=DB.config;
  openModal('Datos de la boda','Editar información',[
    {k:'pareja',label:'Nombres de la pareja',value:c.pareja},
    {k:'fecha',label:'Fecha',type:'date',value:c.fecha,half:true},
    {k:'moneda',label:'Moneda',type:'select',options:['PEN','USD','PYG','EUR'],value:c.moneda,half:true},
    {k:'lugar',label:'Lugar',value:c.lugar},
    {k:'presupuestoTotal',label:'Presupuesto total',type:'number',value:c.presupuestoTotal}
  ],async()=>{
    const obj={pareja:getF('pareja'),fecha:getF('fecha'),moneda:getF('moneda'),lugar:getF('lugar'),presupuestoTotal:+getF('presupuestoTotal')||0};
    setSaving(true);
    try{ DB.config=await server('saveConfig',obj);
      $('#brandNames').textContent=DB.config.pareja;
      $('#brandMono').textContent=(DB.config.pareja||'B').split('&').map(s=>s.trim()[0]).filter(Boolean).slice(0,2).join('');
      closeModal(); render(); toast('Guardado ✓'); }
    catch(e){ toast('Error'); } setSaving(false);
  });
}

  });

async function syncOne(id){
  if(!IN_GAS){ const c=DB.citas.find(x=>x.id===id); c.eventId='preview'; render(); toast('Vista previa: se sincronizaría en Google'); return; }
  setSaving(true); toast('Sincronizando con Calendar…');
  try{ const c=await server('syncCita',id); const i=DB.citas.findIndex(x=>x.id===id); DB.citas[i]=c; render(); toast('Agregado a Google Calendar ✓'); }
  catch(e){ toast('Error al sincronizar'); console.error(e); } setSaving(false);
}
async function syncAll(){ for(const c of DB.citas){ if(!c.eventId) await syncOne(c.id); } }
